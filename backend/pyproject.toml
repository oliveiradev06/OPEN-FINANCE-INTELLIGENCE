[project]
name = "open-finance-intelligence-api"
version = "1.0.0"
description = "Open Finance Intelligence — API, synthetic data pipeline and analytical engines"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = [
    "B008",   # FastAPI dependencies are declared as default arguments
    "SIM108", # explicit if/else reads better in rule code
]

[tool.ruff.lint.per-file-ignores]
"app/data/reference.py" = ["E501"]
"app/services/ai_insights.py" = ["E501"]  # prompt text keeps one instruction per line
"tests/*" = ["E501"]
