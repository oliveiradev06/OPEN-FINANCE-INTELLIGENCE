name: open-finance-intelligence

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ofi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ofi_local}
      POSTGRES_DB: ofi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofi -d ofi"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ofi:${POSTGRES_PASSWORD:-ofi_local}@db:5432/ofi
      SEED_CUSTOMERS: ${SEED_CUSTOMERS:-5000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The first start seeds the database (generation + engines), so allow a long start period.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
